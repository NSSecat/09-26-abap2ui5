name: frontend_rename

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Renamed frontend variant, e.g. standard_v2_#sct#au5 or standard_#sct#au5"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BRANCH: ${{ inputs.branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail

          b="${BRANCH}"

          case "$b" in
            cloud|cloud_v2|standard|standard_v2)
              echo "::error::'$b' is a fixed published branch; use a renamed variant like standard_v2_#sct#au5"
              exit 1
              ;;
          esac

          if ! printf '%s' "$b" | grep -Eq '^[A-Za-z0-9_#]+$'; then
            echo "::error::Invalid branch name '$b'"
            exit 1
          fi

          echo "Branch accepted: $b"

      - name: Build renamed frontend tree
        shell: bash
        run: |
          set -euo pipefail
          echo "Building: ${BRANCH}"
          node tools/build-branches.mjs "${BRANCH}"
          test -d "tools/out/${BRANCH}" || {
            echo "::error::Output dir not found: tools/out/${BRANCH}"
            exit 1
          }

      - name: Check BSP page invariants
        shell: bash
        run: |
          set -euo pipefail
          node tools/check-pages.mjs "${BRANCH}"

      - name: Lint generated standard branch
        if: startsWith(inputs.branch, 'standard') && !startsWith(inputs.branch, 'standard_v2')
        shell: bash
        run: |
          set -euo pipefail
          cd "tools/out/${BRANCH}"
          npx abaplint

      - name: Upload build artifact
        uses: actions/upload-artifact@654efcde4f8d1f5d43c9fcb5d50f6db0a6584d2 # v4
        with:
          name: frontend-rename-${{ inputs.branch }}
          path: tools/out/${{ inputs.branch }}

      - name: Push renamed frontend branch to separate repository
        env:
          FRONTEND_TOKEN: ${{ secrets.FRONTEND_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FRONTEND_TOKEN}" ]; then
            echo "::error::Missing secret FRONTEND_TOKEN"
            exit 1
          fi

          source_dir="tools/out/${BRANCH}"

          if [ ! -d "${source_dir}" ]; then
            echo "::error::Build output '${source_dir}' does not exist"
            exit 1
          fi

          target_repo="NSSecat/09-26-frontend"
          target_branch="${BRANCH}"

          target_url="https://x-access-token:${FRONTEND_TOKEN}@github.com/${target_repo}.git"
          target_dir="$RUNNER_TEMP/frontend-repository"

          rm -rf "${target_dir}"
          git clone --quiet "${target_url}" "${target_dir}"

          cd "${target_dir}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout --quiet -B "${target_branch}" "origin/main"

          # Remove old content in this branch
          git rm -r --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          # Copy generated output tree
          cp -a "${GITHUB_WORKSPACE}/${source_dir}/." .

          git add -A

          if git diff --cached --quiet; then
            echo "${target_branch}: no changes"
            exit 0
          fi

          git commit \
            -m "build: ${target_branch}" \
            -m "Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

          git push --force origin \
            "HEAD:refs/heads/${target_branch}"

          echo "Pushed branch:"
          echo "https://github.com/${target_repo}/tree/${target_branch}"
