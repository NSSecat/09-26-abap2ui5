name: build-rename

# Renames all artifacts to a chosen namespace and pushes the result to
# the branch rename_<name>, e.g. rename_sct_qp — ready to pull with
# abapGit for a parallel installation in the same SAP system.
#
# Input format:
#   #SCT#QP
#   #SCT#CL
#
# The branch name is generated from the two parts:
#   #SCT#QP -> rename_sct_qp

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "ABAP namespace in SAP format, e.g. #SCT#QP"
        required: true
        type: string
        default: "#SCT#QP"

permissions:
  contents: read

concurrency:
  group: build_rename-${{ inputs.namespace }}
  cancel-in-progress: false

jobs:
  build_rename:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    env:
      NAMESPACE: ${{ inputs.namespace }}

    steps:
      - name: Derive namespace and branch name
        shell: bash
        run: |
          set -e

          raw="$NAMESPACE"

          # Accept full SAP namespace format:
          # #SCT#QP or #SCT#CL
          if [[ ! "$raw" =~ ^#[A-Za-z][A-Za-z0-9_]*#[A-Za-z][A-Za-z0-9_]*$ ]]; then
            echo "::error::Invalid namespace '$NAMESPACE'. Expected format #SCT#QP"
            exit 1
          fi

          # Split "#SCT#QP" into:
          # first = SCT
          # second = QP
          first="${raw#\#}"
          first="${first%%\#*}"
          second="${raw##*\#}"

          if ! printf '%s' "$first" | grep -Eq '^[A-Za-z][A-Za-z0-9_]{0,9}$'; then
            echo "::error::Invalid first namespace part '$first'"
            exit 1
          fi

          if ! printf '%s' "$second" | grep -Eq '^[A-Za-z][A-Za-z0-9_]{0,9}$'; then
            echo "::error::Invalid second namespace part '$second'"
            exit 1
          fi

          ns_first=$(printf '%s' "$first" | tr '[:upper:]' '[:lower:]')
          ns_second=$(printf '%s' "$second" | tr '[:upper:]' '[:lower:]')

          # This is the actual ABAP namespace value used in the source tree.
          rename_namespace="#${ns_first}#${ns_second}"

          # Git branch names cannot contain #.
          branch_name="rename_${ns_first}_${ns_second}"

          echo "RENAME_NAMESPACE=$rename_namespace" >> "$GITHUB_ENV"
          echo "BRANCH=$branch_name" >> "$GITHUB_ENV"

          echo "Input namespace: $NAMESPACE"
          echo "ABAP namespace: $rename_namespace"
          echo "Branch: $branch_name"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          npm-ci: "true"

      # Set the chosen namespace in the rename config and run the abaplint rename.
      - name: Rename to ${{ inputs.namespace }}
        shell: bash
        run: |
          set -e

          # Example:
          # znamespace -> #sct#qp
          sed "s/znamespace/$RENAME_NAMESPACE/g" \
            .github/abaplint/rename.jsonc \
            > .github/abaplint/rename_run.jsonc

          npx abaplint .github/abaplint/rename_run.jsonc --rename

      - name: Assemble branch content
        shell: bash
        run: |
          set -e

          src=$(find .github/abaplint/output -type d -name src | head -n 1)
          if [ -z "$src" ]; then
            echo "::error::no renamed src folder found under .github/abaplint/output"
            exit 1
          fi

          out=".github/out/$BRANCH"
          rm -rf "$out"
          mkdir -p "$out"

          cp -r "$src" "$out/src"
          cp LICENSE "$out/"

          # Replace the interface name in .abapgit.xml
          # ABAP uses upper-case for the first segment, e.g. Z2UI5_IF_APP
          ns_upper_first=$(printf '%s' "${RENAME_NAMESPACE#\#}" | cut -d'#' -f1 | tr '[:lower:]' '[:upper:]')
          ns_upper_second=$(printf '%s' "${RENAME_NAMESPACE##*\#}" | tr '[:lower:]' '[:upper:]')

          # If your interface name is built like:
          # Z2UI5_IF_APP
          # then some systems expect:
          # SCT_IF_APP or QP_IF_APP depending on your template.
          #
          # If your rename config expects a different pattern, adjust this line below.
          sed "s/Z2UI5_IF_APP/${ns_upper_first}_${ns_upper_second}_IF_APP/" \
            .abapgit.xml \
            > "$out/.abapgit.xml"

      - name: Push renamed branch
        shell: bash
        run: |
          set -e

          b="$BRANCH"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git fetch origin "$b" --depth 1 2>/dev/null || true
          parent=$(git rev-parse -q --verify "refs/remotes/origin/$b" || true)

          index="$RUNNER_TEMP/index-$b"
          rm -f "$index"

          (
            cd ".github/out/$b"
            GIT_DIR="$GITHUB_WORKSPACE/.git"
            GIT_WORK_TREE=.
            GIT_INDEX_FILE="$index"
            git add -A
          )

          tree=$(GIT_INDEX_FILE="$index" git write-tree)

          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "$b: no changes"
            exit 0
          fi

          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -p "$GITHUB_SHA" -m "build: $b from $GITHUB_SHA")
          git push origin "$commit:refs/heads/$b"

          echo "$b: pushed $commit"
